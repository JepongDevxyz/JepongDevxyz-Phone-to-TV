name: Android Build Verification
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle --no-daemon clean lintDebug assembleDebug
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | head -20
      - name: Create source ZIP
        run: |
          git archive --format=zip --output=JepongDevxyz-Phone-to-TV-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Send-Files-to-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Send-Files-to-TV-Source
          path: JepongDevxyz-Phone-to-TV-source.zip
