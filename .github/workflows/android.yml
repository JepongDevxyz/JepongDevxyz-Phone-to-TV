name: Android Build Verification
on:
  push:
    branches: [ main, fix/verified-branding-modern-ui ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle --no-daemon clean lintDebug assembleDebug
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          BADGING="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk)"
          echo "$BADGING" | head -30
          echo "$BADGING" | grep "versionCode='3'"
          echo "$BADGING" | grep "versionName='1.2.0'"
          echo "$BADGING" | grep "application-icon"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'res/.*/ic_launcher|brand_logo|brand_splash'
      - name: Create source ZIP
        run: |
          git archive --format=zip --output=JepongDevxyz-Phone-to-TV-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Send-Files-to-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Send-Files-to-TV-Source
          path: JepongDevxyz-Phone-to-TV-source.zip

# exact PNG branding verification
